{% extends 'base.html' %}

{% block content %}

<div class="card" style="max-width:400px; margin:auto;">

    <h2>Registro de Usuario</h2>

    <form method="POST">

        <input class="form-control"
               type="text"
               name="username"
               placeholder="Usuario"
               required>

        <br>

        <input class="form-control"
               type="password"
               name="password"
               placeholder="Contraseña"
               required>

        <br>

        <button class="btn btn-primary w-100">
            Registrarse
        </button>

    </form>

</div>

{% endblock %}
