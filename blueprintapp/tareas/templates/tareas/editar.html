{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Editar Tarea</h2>
  <form method="POST">
    <div class="mb-3">
      <label for="descripcion" class="form-label">Descripción</label>
      <input type="text" class="form-control" id="descripcion" name="descripcion" value="{{ tarea.descripcion }}">
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="completado" name="completado" {% if tarea.completado %}checked{% endif %}>
      <label class="form-check-label" for="completado">Completado</label>
    </div>
    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="{{ url_for('bp_tarea.index') }}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
